{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 mb-20 bg-white p-8 rounded-2xl shadow border border-gray-100 dark:bg-gray-800 dark:border-gray-700">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 mb-2">Checkout</h1>
        <p class="text-gray-500 xl:text-lg dark:text-gray-400">Complete your payment for <strong>{{ course.title }}</strong></p>
    </div>

    <div class="bg-gray-50 dark:bg-gray-900 rounded-xl p-6 mb-8 border border-gray-200 dark:border-gray-700 flex flex-col md:flex-row items-center gap-6">
        {% if course.image %}
        <img src="{{ course.image.url }}" alt="{{ course.title }}" class="w-32 h-32 object-cover rounded-lg shadow-sm">
        {% else %}
        <div class="w-32 h-32 bg-gray-200 dark:bg-gray-700 rounded-lg flex items-center justify-center">
            <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
        </div>
        {% endif %}
        
        <div class="flex-1 text-center md:text-left">
            <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100">{{ course.title }}</h3>
            <p class="text-gray-500 mt-1 dark:text-gray-400">{{ enrollment.mode }} Class</p>
            <div class="mt-4 inline-block px-4 py-2 bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 rounded-full font-bold text-lg">
                ₹{{ course.price }}
            </div>
        </div>
    </div>

    <form action="{% url 'parents:razorpay_success_callback' %}" method="POST" class="text-center">
        <!-- Razorpay Script adds the payment button inside the form automatically -->
        <script src="https://checkout.razorpay.com/v1/checkout.js"
                data-key="{{ razorpay_key_id }}"
                data-amount="{{ amount_in_paise }}"
                data-currency="INR"
                data-order_id="{{ order_id }}"
                data-buttontext="Pay with Razorpay"
                data-name="Inventobots Academy"
                data-description="{{ course.title }} Enrollment"
                data-image="{% if course.image %}{{ course.image.url }}{% else %}https://your-logo-url.com/logo.png{% endif %}"
                data-prefill.name="{{ student.full_name }}"
                data-theme.color="#4f46e5">
        </script>
        
        <!-- Let's wrap their button in something nicer using Tailwind. The checkout script adds a standard button, but we can potentially trigger it manually or just accept theirs. For simplicity we let razorpay inject the button and then we style it using JS, or provide a wrap. Razorpay's injected button can be ugly. -->
    </form>
    
    <div class="mt-6 text-center text-sm text-gray-500 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        Secured by Razorpay
    </div>
</div>

<script>
    // Just styling the Razorpay button added dynamically
    window.addEventListener('load', () => {
        setTimeout(() => {
            const rzpBtn = document.querySelector('.razorpay-payment-button');
            if(rzpBtn) {
                rzpBtn.className = "w-full md:w-auto inline-flex items-center justify-center px-8 py-3.5 border border-transparent text-lg font-bold rounded-xl text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 shadow-lg transform transition hover:scale-105 active:scale-95";
            }
        }, 500); // 500ms allows the script to inject the button first
    });
</script>
{% endblock %}
