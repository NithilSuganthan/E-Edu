<!-- Lab Container -->
<div x-data="labData({{ unlocked_features|safe }})" x-init="init()"
    class="pt-32 pb-20 px-4 min-h-screen transition-colors duration-300"
    :class="darkMode ? 'bg-slate-900' : 'bg-slate-50'">
    <div class="max-w-7xl mx-auto">

        <div class="text-center mb-12">
            <span
                class="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Interactive
                Learning</span>
            <h1 class="text-4xl md:text-5xl font-extrabold mt-6 dark:text-white">Inventobots <span
                    class="gradient-text">Virtual
                    Lab</span></h1>
        </div>

        <!-- Lab Tabs -->
        <div
            class="flex justify-center mb-10 bg-white dark:bg-slate-800 p-2 rounded-2xl shadow-sm inline-flex mx-auto w-full md:w-auto overflow-x-auto border border-slate-100 dark:border-slate-700">
            <button @click="activeTab = 'code'"
                :class="activeTab === 'code' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'"
                class="px-8 py-3 rounded-xl font-bold transition-all whitespace-nowrap flex items-center gap-2">
                <i data-lucide="terminal" class="w-5 h-5"></i> Code Studio
            </button>
            <button @click="activeTab = 'circuit'"
                :class="activeTab === 'circuit' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'"
                class="px-8 py-3 rounded-xl font-bold transition-all whitespace-nowrap flex items-center gap-2">
                <i data-lucide="zap" class="w-5 h-5"></i> Circuit Lab
            </button>
            <button @click="activeTab = 'abacus'"
                :class="activeTab === 'abacus' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'"
                class="px-8 py-3 rounded-xl font-bold transition-all whitespace-nowrap flex items-center gap-2">
                <i data-lucide="calculator" class="w-5 h-5"></i> Virtual Abacus
            </button>
            <button @click="activeTab = 'memory'"
                :class="activeTab === 'memory' ? 'bg-pink-600 text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'"
                class="px-8 py-3 rounded-xl font-bold transition-all whitespace-nowrap flex items-center gap-2">
                <i data-lucide="brain-circuit" class="w-5 h-5"></i> Memory Games
            </button>
        </div>

        {% include 'components/lab_tabs/code_studio.html' %}
        {% include 'components/lab_tabs/circuit_lab.html' %}
        {% include 'components/lab_tabs/abacus.html' %}
        {% include 'components/lab_tabs/memory_games.html' %}

    </div>
</div>
