{% extends 'base.html' %}
{% load static %}

{% block title %}Logged Out | Inventobots Academy{% endblock %}

{% block content %}
<div
    class="min-h-screen pt-32 pb-20 px-4 flex items-center justify-center bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div class="max-w-md w-full text-center relative z-10">

        <!-- Background Orbs -->
        <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 bg-blue-500/20 rounded-full blur-3xl -z-10 animate-blob">
        </div>
        <div
            class="absolute bottom-0 right-0 w-64 h-64 bg-purple-500/20 rounded-full blur-3xl -z-10 animate-blob animation-delay-2000">
        </div>

        <div
            class="bg-white dark:bg-slate-900 p-10 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800">
            <div
                class="w-20 h-20 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="log-out" class="w-10 h-10 text-blue-600 dark:text-blue-400"></i>
            </div>

            <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-4">
                Logged Out
            </h1>

            <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                You have been safely logged out of the Inventobots Academy admin portal.
            </p>

            <div class="space-y-4">
                <a href="{% url 'admin:index' %}"
                    class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-blue-500/30 flex items-center justify-center gap-2 group">
                    <span>Log In Again</span>
                    <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                </a>

                <a href="/"
                    class="block w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-4 rounded-xl transition-all">
                    Return to Home
                </a>
            </div>
        </div>

        <p class="mt-8 text-sm text-slate-500">
            &copy; 2026 Inventobots Academy
        </p>
    </div>
</div>
{% endblock %}
