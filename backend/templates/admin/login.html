{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Inventobots Academy</title>
    <link rel="icon" href="/static/Logo.png">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .glass-card {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        /* Dark Mode Transitions */
        body,
        .glass-card,
        div,
        section,
        a,
        button,
        p,
        h1,
        h2,
        h3,
        h4,
        span,
        li,
        input,
        label {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        /* Form Field Styling */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }

        .dark input[type="text"],
        .dark input[type="password"] {
            background-color: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 flex items-center justify-center min-h-screen overflow-hidden relative"
    x-data="{ darkMode: true }" x-init="document.documentElement.classList.add('dark')">

    <!-- Animated Background -->
    <div class="fixed inset-0 pointer-events-none">
        <div
            class="absolute top-0 left-0 w-96 h-96 bg-blue-300 dark:bg-blue-900/20 rounded-full blur-3xl opacity-50 -translate-x-1/2 -translate-y-1/2">
        </div>
        <div
            class="absolute bottom-0 right-0 w-96 h-96 bg-purple-300 dark:bg-purple-900/20 rounded-full blur-3xl opacity-50 translate-x-1/3 translate-y-1/3">
        </div>
    </div>

    <!-- Login Container -->
    <div class="relative w-full max-w-md p-4">
        <div
            class="glass-card bg-white/80 dark:bg-slate-900/60 dark:border-white/10 rounded-[2rem] p-8 md:p-10 relative overflow-hidden">

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center mb-6">
                    <!-- Assuming static logo path, adjusting based on previous file's context if needed, but '/static/Logo.png' seems standard here -->
                    <img src="/static/Logo.png" alt="Inventobots Academy" class="h-16 w-auto drop-shadow-md">
                </div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Administration</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Secure access for staff only</p>
            </div>

            {% if form.errors %}
            <div
                class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4 flex items-start gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 dark:text-red-400 flex-shrink-0 mt-0.5"></i>
                <p class="text-sm text-red-600 dark:text-red-400">Invalid username or password. Please try again.</p>
            </div>
            {% endif %}

            <form action="{{ app_path }}" method="post" id="login-form" class="space-y-5">
                {% csrf_token %}

                <div class="space-y-1.5">
                    <label for="id_username"
                        class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <div class="[&>input]:pl-10">
                            {{ form.username }}
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="id_password"
                        class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
                            <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <div class="[&>input]:pl-10">
                            {{ form.password }}
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <a href="/"
                    class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition-colors flex items-center justify-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i>
                    Back to Website
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            lucide.createIcons();
        });

        // Find inputs and add placeholder if missing (Django admin widgets might not have them)
        document.addEventListener('DOMContentLoaded', function () {
            const userApp = document.getElementById('id_username');
            const passApp = document.getElementById('id_password');
            if (userApp) userApp.placeholder = 'Enter your username';
            if (passApp) passApp.placeholder = 'Enter your password';
        });
    </script>
</body>

</html>
