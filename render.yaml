services:
  - type: web
    name: inventobots-academy-demo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
    preDeployCommand: "python manage.py migrate"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # set to your onrender.com hostname after first deploy
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # set to https://<your-app>.onrender.com after first deploy
      - key: ADMIN_URL
        sync: false # choose a private admin path, e.g. secret-admin-xyz/
      - key: DATABASE_URL
        fromDatabase:
          name: inventobots-demo-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: inventobots-demo-db
    plan: basic-256mb # lowest-cost Postgres; check current Render free-tier DB availability at deploy time
    databaseName: inventobots_demo
    user: inventobots_demo
