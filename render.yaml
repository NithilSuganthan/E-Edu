services:
  - type: web
    name: inventobots-academy-demo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_courses && python manage.py seed_hero_courses && python manage.py seed_demo_accounts && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
    preDeployCommand: "python manage.py migrate && python manage.py createcachetable"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_URL
        value: "admin/"
      - key: DATABASE_URL
        fromDatabase:
          name: inventobots-demo-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DB_SSLMODE
        value: "require"

databases:
  - name: inventobots-demo-db
    plan: basic-256mb
    databaseName: inventobots_demo
    user: inventobots_demo
